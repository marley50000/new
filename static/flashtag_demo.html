<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashTag High-Speed Navigation Demo</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #1a2a6c; }
        .upload-area {
            border: 2px dashed #ccc;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            margin: 20px 0;
            cursor: pointer;
        }
        .upload-area:hover { border-color: #1a2a6c; }
        #preview {
            max-width: 100%;
            margin-top: 20px;
            display: none;
            border-radius: 8px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eef2f3;
            border-radius: 8px;
            display: none;
        }
        .tag-id {
            font-size: 24px;
            font-weight: bold;
            color: #1a2a6c;
        }
        .nav-btn {
            background: #1a2a6c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FlashTag Demo</h1>
        <p>FlashTag is designed for high-speed indoor navigation. Upload an image (even a blurred one) to detect tags.</p>

        <div class="upload-area" id="drop-zone">
            <p>Click or Drag & Drop an image here</p>
            <input type="file" id="file-input" hidden accept="image/*">
        </div>

        <img id="preview" alt="Preview">

        <div class="result" id="result-area">
            <h3>Detection Result:</h3>
            <div id="detection-details"></div>
        </div>

        <a href="/" class="nav-btn">Back to Home</a>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const resultArea = document.getElementById('result-area');
        const detectionDetails = document.getElementById('detection-details');

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (re) => {
                    preview.src = re.target.result;
                    preview.style.display = 'block';
                    detectTag(file);
                };
                reader.readAsDataURL(file);
            }
        };

        async function detectTag(file) {
            const formData = new FormData();
            formData.append('file', file);

            detectionDetails.innerHTML = 'Detecting...';
            resultArea.style.display = 'block';

            try {
                const response = await fetch('/detect_flashtag', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.tags && data.tags.length > 0) {
                    detectionDetails.innerHTML = data.tags.map(tag => `
                        <div style="margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">
                            <strong>ID:</strong> <span class="tag-id">${tag.id}</span><br>
                            <strong>Position:</strong> (${tag.center[0]}, ${tag.center[1]})<br>
                            <strong>Confidence:</strong> High (Motion Robust)
                        </div>
                    `).join('');
                } else {
                    detectionDetails.innerHTML = 'No FlashTags detected.';
                }
            } catch (err) {
                detectionDetails.innerHTML = 'Error communicating with backend.';
                console.error(err);
            }
        }
    </script>
</body>
</html>
